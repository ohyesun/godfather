workflows:
  android-portable:
    name: Android portable static library
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Locate Android NDK
        script: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          NDK="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-}}"
          if [ -z "$NDK" ] || [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            if [ -f "$SDK/ndk/27.0.12077973/build/cmake/android.toolchain.cmake" ]; then
              NDK="$SDK/ndk/27.0.12077973"
            fi
          fi
          if [ -z "$NDK" ] || [ ! -f "$NDK/build/cmake/android.toolchain.cmake" ]; then
            SDKMGR="$(command -v sdkmanager || true)"
            if [ -z "$SDKMGR" ] && [ -d "$SDK/cmdline-tools" ]; then
              SDKMGR="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
            fi
            [ -n "$SDKMGR" ] || { echo "sdkmanager not found; cannot install NDK" >&2; exit 2; }
            yes | "$SDKMGR" --licenses >/dev/null || true
            "$SDKMGR" "ndk;27.0.12077973"
            NDK="$SDK/ndk/27.0.12077973"
          fi
          test -f "$NDK/build/cmake/android.toolchain.cmake"
          printf 'NDK=%s\n' "$NDK" > "$CM_BUILD_DIR/ndk-path.env"
          "$NDK/ndk-build" --version >/dev/null 2>&1 || true
      - name: Resolve CMake
        script: |
          set -eu
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          CMAKE_BIN=""
          if [ -x "$SDK/cmake/3.22.1/bin/cmake" ]; then
            CMAKE_BIN="$SDK/cmake/3.22.1/bin/cmake"
          elif [ -d "$SDK/cmake" ]; then
            CMAKE_SDK_NAME="$(for candidate in "$SDK"/cmake/*; do
              [ -x "$candidate/bin/cmake" ] && basename "$candidate"
            done | sort -t. -k1,1nr -k2,2nr -k3,3nr | head -n 1)"
            if [ -n "$CMAKE_SDK_NAME" ]; then
              CMAKE_BIN="$SDK/cmake/$CMAKE_SDK_NAME/bin/cmake"
            fi
          fi
          if [ -z "$CMAKE_BIN" ]; then
            CMAKE_BIN="$(command -v cmake 2>/dev/null || true)"
          fi
          if [ -z "$CMAKE_BIN" ]; then
            if command -v brew >/dev/null 2>&1; then
              brew install cmake
            fi
            CMAKE_BIN="$(command -v cmake 2>/dev/null || true)"
          fi
          [ -n "$CMAKE_BIN" ] || { echo "cmake not found and brew install failed" >&2; exit 2; }
          "$CMAKE_BIN" --version
          CMAKE_VERSION="$("$CMAKE_BIN" --version | sed -n 's/^cmake version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          [ -n "$CMAKE_VERSION" ] || { echo "cannot parse cmake version" >&2; exit 2; }
          CMAKE_MAJOR="${CMAKE_VERSION%%.*}"
          CMAKE_REST="${CMAKE_VERSION#*.}"
          CMAKE_MINOR="${CMAKE_REST%%.*}"
          if [ "$CMAKE_MAJOR" -lt 3 ] || { [ "$CMAKE_MAJOR" -eq 3 ] && [ "$CMAKE_MINOR" -lt 16 ]; }; then
            echo "cmake >= 3.16 required, found $CMAKE_VERSION" >&2
            exit 2
          fi
          printf 'CMAKE_BIN=%s\n' "$CMAKE_BIN" > "$CM_BUILD_DIR/cmake-path.env"
      - name: Configure Android
        script: |
          set -eu
          . "$CM_BUILD_DIR/ndk-path.env"
          . "$CM_BUILD_DIR/cmake-path.env"
          "$CMAKE_BIN" -S design -B build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CM_BUILD_DIR/out/android-arm64" \
            -DZG_LEGACY_ROOT="$CM_BUILD_DIR/vendor/legacy" \
            -DZG_ADAPTER_ROOT="$CM_BUILD_DIR/vendor/adapter"
      - name: Build Android
        script: |
          set -eu
          . "$CM_BUILD_DIR/cmake-path.env"
          "$CMAKE_BIN" --build build-android --target install
    artifacts:
      - out/android-arm64/**
      - build-android/CMakeCache.txt

  ios-portable:
    name: iOS device portable static library
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Resolve CMake
        script: |
          set -eu
          CMAKE_BIN="$(command -v cmake 2>/dev/null || true)"
          if [ -z "$CMAKE_BIN" ] && [ -x /opt/homebrew/bin/cmake ]; then
            CMAKE_BIN=/opt/homebrew/bin/cmake
          fi
          if [ -z "$CMAKE_BIN" ] && [ -x /usr/local/bin/cmake ]; then
            CMAKE_BIN=/usr/local/bin/cmake
          fi
          if [ -z "$CMAKE_BIN" ]; then
            if command -v brew >/dev/null 2>&1; then
              brew install cmake
            fi
            CMAKE_BIN="$(command -v cmake 2>/dev/null || true)"
          fi
          [ -n "$CMAKE_BIN" ] || { echo "cmake not found and brew install failed" >&2; exit 2; }
          "$CMAKE_BIN" --version
          CMAKE_VERSION="$("$CMAKE_BIN" --version | sed -n 's/^cmake version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          [ -n "$CMAKE_VERSION" ] || { echo "cannot parse cmake version" >&2; exit 2; }
          CMAKE_MAJOR="${CMAKE_VERSION%%.*}"
          CMAKE_REST="${CMAKE_VERSION#*.}"
          CMAKE_MINOR="${CMAKE_REST%%.*}"
          if [ "$CMAKE_MAJOR" -lt 3 ] || { [ "$CMAKE_MAJOR" -eq 3 ] && [ "$CMAKE_MINOR" -lt 16 ]; }; then
            echo "cmake >= 3.16 required, found $CMAKE_VERSION" >&2
            exit 2
          fi
          printf 'CMAKE_BIN=%s\n' "$CMAKE_BIN" > "$CM_BUILD_DIR/cmake-path.env"
      - name: Configure iOS device arm64
        script: |
          set -eu
          . "$CM_BUILD_DIR/cmake-path.env"
          "$CMAKE_BIN" -S design -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$CM_BUILD_DIR/out/ios-device-arm64" \
            -DZG_LEGACY_ROOT="$CM_BUILD_DIR/vendor/legacy" \
            -DZG_ADAPTER_ROOT="$CM_BUILD_DIR/vendor/adapter"
      - name: Build iOS
        script: |
          set -eu
          . "$CM_BUILD_DIR/cmake-path.env"
          "$CMAKE_BIN" --build build-ios --target install
    artifacts:
      - out/ios-device-arm64/**
      - build-ios/CMakeCache.txt
