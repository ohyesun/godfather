<script type="module" src="ios-startup.js"></script><script id="pcZoneMemory114">// Remember the player's latest choice on this device, scoped to this gateway.
(()=>{
 const select=document.getElementById('serverZone');
 if(!select)return;
 const key='zg.pc.lastZone114:'+document.getElementById('endpoint').value;
 const available=value=>!!value&&Array.from(select.options).some(option=>option.value===value&&!option.disabled);
 try{const saved=localStorage.getItem(key);if(available(saved))select.value=saved;}catch{}
 const group=document.getElementById('serverZones114');
 const buttons=()=>group?Array.from(group.querySelectorAll('button[data-zone114]')):[];
 const paint=()=>{
  const selected=available(select.value)?select.value:'';
  for(const [index,button]of buttons().entries()){
   const checked=button.dataset.zone114===selected;
   button.setAttribute('aria-checked',String(checked));
   button.tabIndex=checked||(!selected&&index===0)?0:-1;
  }
 };
 const choose=button=>{
  if(!button||!buttons().includes(button)||!available(button.dataset.zone114))return;
  select.value=button.dataset.zone114;
  select.dispatchEvent(new Event('change',{bubbles:true}));
 };
 group?.addEventListener('click',event=>{
  const button=event.target.closest?.('button[data-zone114]');
  if(button&&group.contains(button))choose(button);
 });
 group?.addEventListener('keydown',event=>{
  const current=buttons(),index=current.indexOf(event.target);
  if(index<0)return;
  let next;
  if(['ArrowRight','ArrowDown'].includes(event.key))next=(index+1)%current.length;
  else if(['ArrowLeft','ArrowUp'].includes(event.key))next=(index+current.length-1)%current.length;
  else if(event.key==='Home')next=0;
  else if(event.key==='End')next=current.length-1;
  else return;
  if(!current.length)return;
  event.preventDefault();choose(current[next]);current[next].focus();
 });
 select.addEventListener('change',()=>{
  paint();
  if(!available(select.value))return;
  try{localStorage.setItem(key,select.value);}catch{}
 });
 paint();
})();
