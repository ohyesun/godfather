plugins {
    id "com.android.application"
}

android {
    namespace "com.zg335.host"
    compileSdk 34
    ndkVersion "27.0.12077973"

    defaultConfig {
        applicationId "com.zg335.host"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            abiFilters "x86_64", "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    androidResources {
        noCompress += ["pak"]
    }
}

dependencies {
    implementation "androidx.webkit:webkit:1.9.0"
}
